name: Test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clean stale nix users (macOS)
        if: runner.os == 'macOS'
        #   run: |
        #     sudo dscl . -delete /Groups/_nixbld 2>/dev/null || true
        #     sudo dscl . -list /Users | grep _nixbld | while read user; do
        #       sudo dscl . -delete "/Users/$user"
        #     done
        run: |
          if [ -d /nix ]; then
            /nix/nix-installer uninstall --no-confirm 2>/dev/null || true
          fi
          sudo dscl . -delete /Groups/nixbld 2>/dev/null || true
          sudo dscl . -delete /Groups/_nixbld 2>/dev/null || true
          sudo dscl . -list /Users | grep nixbld | while read user; do
            sudo dscl . -delete "/Users/$user"
          done
          sudo rm -rf /etc/nix /nix /var/root/.nix-* 2>/dev/null || true
          sudo launchctl remove org.nixos.nix-daemon 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
        with:
          # Default is true, which puts the runner in trusted-users. The
          # wrapper refuses allowNix for a trusted user, because the agent
          # inherits that trust and nix documents it as root on the host, so
          # the nix suite would have nothing left to exercise.
          trust-runner-user: false
          extra-conf: ${{ runner.os == 'macOS' && 'sandbox = true' || '' }}

      - name: Run sandbox tests
        run: bash tests/run-all.sh

      - name: Run pytest suite
        if: ${{ !cancelled() }}
        run: nix develop -c pytest

      - name: Type-check
        if: ${{ !cancelled() }}
        run: nix develop -c mypy

      - name: Sandbox denials and OS version (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        run: |
          sw_vers
          /usr/bin/log show --last 20m --style compact \
            --predicate 'eventMessage CONTAINS "deny(1)" AND (eventMessage CONTAINS "Chrome" OR eventMessage CONTAINS "chromedriver" OR eventMessage CONTAINS "google-chrome")' \
            | sed -E 's/.*Sandbox: ([^(]+)\([0-9]+\) /\1 /' | sort | uniq -c | sort -rn | head -60
